name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: typecheck the app, the settings page and the tests
        run: bun run --cwd apps/plane-thing typecheck

      - name: unit tests
        run: bun run --cwd apps/plane-thing test

      - name: build, bundle and validate the catalog
        env:
          CHECK_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: bun run check
